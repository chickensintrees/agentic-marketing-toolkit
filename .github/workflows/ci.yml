# CI: the referee. Runs the definition of done (SPEC.md §6, §7) on every push
# and pull request, the same way for every contributor and every agent.
# Pull requests from forks run with a read-only token and no secrets; this
# workflow needs neither. Never switch it to pull_request_target.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test and build
        run: npm run check

      - name: Skills folders are identical (.agents/skills and .claude/skills)
        run: diff -r .agents/skills .claude/skills
